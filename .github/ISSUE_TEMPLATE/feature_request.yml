name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Inference / Native (C++ / NDK)
        - Chat UI
        - Model Catalog / Downloads
        - Settings / Configuration
        - Performance / Memory
        - Build System / CI
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues — this is not a duplicate
          required: true
        - label: This aligns with Locian's offline-first, privacy-first design
          required: true
