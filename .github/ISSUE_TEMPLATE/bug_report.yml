name: Bug Report
description: Report a crash, incorrect behavior, or build failure
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. For security vulnerabilities,
        use **Private Vulnerability Reporting** (not public issues).

  - type: input
    id: device
    attributes:
      label: Device Model
      placeholder: e.g. Samsung Galaxy S23, Pixel 8 Pro, OnePlus 12
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android Version / API Level
      placeholder: e.g. Android 14 / API 34
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Locian Version
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: GGUF Model in Use
      placeholder: e.g. Qwen 2.5 1.5B Q4_K_M, or custom GGUF filename
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open app
        2. Load model X
        3. Send message Y
        4. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logcat / Crash Output
      description: |
        Run: adb logcat -s Locian
        Or attach the full crash log.
      render: shell
