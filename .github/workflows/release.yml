name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    outputs:
      apk-name: ${{ steps.apk-name.outputs.name }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK + NDK r27.0.12077973
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 27.0.12077973
          cmake-version: 3.22.1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache NDK build outputs
        uses: actions/cache@v4
        with:
          path: |
            inference/.cxx
            app/.cxx
          key: ndk-${{ runner.os }}-27.0.12077973-${{ hashFiles('inference/src/main/cpp/CMakeLists.txt') }}
          restore-keys: ndk-${{ runner.os }}-27.0.12077973-

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > locian-release.keystore

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/locian-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Determine APK name
        id: apk-name
        run: echo "name=locian-${{ github.ref_name }}-release.apk" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk "${{ steps.apk-name.outputs.name }}"

      - name: Generate SHA-256 checksum
        run: |
          sha256sum "${{ steps.apk-name.outputs.name }}" > "${{ steps.apk-name.outputs.name }}.sha256"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            ${{ steps.apk-name.outputs.name }}
            ${{ steps.apk-name.outputs.name }}.sha256

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release-apk
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-apk

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NO_V="${VERSION#v}"
          BODY=$(awk "/^## \[${VERSION_NO_V}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Locian ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.body }}
          prerelease: false
          files: |
            ${{ needs.build-release-apk.outputs.apk-name }}
            ${{ needs.build-release-apk.outputs.apk-name }}.sha256
