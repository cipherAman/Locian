name: CodeQL Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 02:00 UTC

jobs:
  analyze-kotlin:
    name: Analyze (kotlin)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false   # Kotlin analysis doesn't need C++ submodules
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0 platforms;android-35'
          accept-android-sdk-licenses: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: kotlin
          build-mode: manual
          config-file: .github/codeql/codeql-config.yml

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-codeql-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-codeql-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # --no-configuration-cache forces Gradle to actually invoke the Kotlin compiler
      # (not replay from cache), so CodeQL's JVM tracer can intercept the compilation.
      # We compile only pure-Kotlin modules — inference is excluded because its
      # compileDebugKotlin is entangled with CMake configuration when NDK is absent.
      - name: Compile Kotlin sources (no config cache, no NDK)
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          ./gradlew --no-configuration-cache \
            :core:core-common:compileDebugKotlin \
            :core:core-model:compileDebugKotlin \
            :core:core-ui:compileDebugKotlin \
            :data:data-database:compileDebugKotlin \
            :data:data-datastore:compileDebugKotlin \
            :data:data-network:compileDebugKotlin \
            :data:data-repository:compileDebugKotlin \
            :domain:domain-inference:compileDebugKotlin \
            :feature:feature-chat:compileDebugKotlin \
            :feature:feature-models:compileDebugKotlin \
            :feature:feature-settings:compileDebugKotlin \
            :feature:feature-conversations:compileDebugKotlin \
            :app:compileDebugKotlin

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:kotlin"

  analyze-cpp:
    name: Analyze (cpp)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout with submodules (required for C++ analysis)
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          # 'none' build-mode: CodeQL analyses C++ source files directly without
          # requiring a full NDK build. This avoids the 17-min llama.cpp compile.
          build-mode: none
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"
