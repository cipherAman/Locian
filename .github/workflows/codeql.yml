name: CodeQL Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 02:00 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [kotlin, cpp]

    steps:
      - name: Checkout with submodules (required for C++ analysis)
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK + NDK (for C++ analysis)
        if: matrix.language == 'cpp'
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 27.0.12077973
          cmake-version: 3.22.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Manual build mode required for NDK projects (CodeQL cannot autobuild NDK)
          build-mode: manual

      - name: Build (manual trace for CodeQL)
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK (trace for CodeQL)
        run: ./gradlew assembleDebug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
