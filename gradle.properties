# Gradle JVM heap — increase if builds OOM on CI
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# NOTE: Do NOT set org.gradle.java.home here.
# Set JAVA_HOME in your shell profile, or override in local.properties.

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin style
kotlin.code.style=official

# KSP incremental compilation
ksp.incremental=true

# Parallel + cached builds for faster local development
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache
org.gradle.configuration-cache=true
